name: ci
on:
  push:
  pull_request:
jobs:
  yara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yara-python yara-x cabarchive pyyaml
      - name: Compile every YARA rule with yara-python and YARA-X
        run: python tests/run_yara_tests.py --compile-only
  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml yamllint sigma-cli pysigma "pySigma-validators-sigmahq==0.21.*"
      - name: yamllint (catches duplicate keys that the Sigma loader silently drops)
        run: >-
          yamllint -d '{extends: relaxed, rules: {line-length: disable, key-duplicates: enable}}' --strict sigma/
      - name: sigma check
        run: sigma check --fail-on-error --fail-on-issues --validation-config tests/sigma_cli_conf.yml sigma/
      - name: Sigma logic tests on synthetic events
        run: python tests/test_sigma_synthetic.py
  iocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tests/validate_iocs.py
      - name: INDEX.md must match the case.yml files
        run: python tools/build_index.py --check
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml stix2 stix2-validator pymisp
      - name: STIX 2.1 and MISP exports must match iocs.json + case.yml
        run: python tools/export_iocs.py --check
      - name: Validate STIX 2.1 (stix2-validator, stix2) and load MISP events (PyMISP)
        run: python tests/validate_exports.py
  velociraptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch Velociraptor v0.77.4 linux-amd64 (sha256 pinned to the release digest)
        run: |
          curl -sSL -o velo.gz https://github.com/Velocidex/velociraptor/releases/download/v0.77.4/velociraptor-v0.77.4-linux-amd64.gz
          echo "890c1b8458276909cfbbfb2edad2e0b9c31672b95532e41516c39d2537925157  velo.gz" | sha256sum -c -
          gunzip velo.gz && chmod 755 velo && mv velo "$RUNNER_TEMP/velociraptor"
      - name: Artifact verify + fixture regression tests
        run: |
          VELOCIRAPTOR="$RUNNER_TEMP/velociraptor" python velociraptor/tests/run_sweep_tests.py
      - name: UserDirInterpreter - inert process plants (renamed bash copies that only sleep)
        run: |
          VELOCIRAPTOR="$RUNNER_TEMP/velociraptor" python velociraptor/tests/run_interp_tests.py
      - name: macOS artifacts - verify, capability scan and synthetic fixture tests
        run: |
          VELOCIRAPTOR="$RUNNER_TEMP/velociraptor" python velociraptor/tests/run_macos_tests.py
  sigma-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Sigma replay harness tests (engine, parity with synthetic tests, one known TP on real Sysmon events)
        run: python -m pytest -q tools/sigma-replay/tests
