name: ci
on:
  push:
  pull_request:
jobs:
  yara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yara-python yara-x cabarchive pyyaml
      - name: Compile every YARA rule with yara-python and YARA-X
        run: python tests/run_yara_tests.py --compile-only
  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml yamllint sigma-cli pysigma "pySigma-validators-sigmahq==0.21.*"
      - name: yamllint (catches duplicate keys that the Sigma loader silently drops)
        run: yamllint -d "{extends: relaxed, rules: {line-length: disable, key-duplicates: enable}}" --strict sigma/
      - name: sigma check
        run: sigma check --fail-on-error --fail-on-issues --validation-config tests/sigma_cli_conf.yml sigma/
      - name: Sigma logic tests on synthetic events
        run: python tests/test_sigma_synthetic.py
  iocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tests/validate_iocs.py
      - name: INDEX.md must match the case.yml files
        run: python tools/build_index.py --check
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml stix2 stix2-validator pymisp
      - name: STIX 2.1 and MISP exports must match iocs.json + case.yml
        run: python tools/export_iocs.py --check
      - name: Validate STIX 2.1 (stix2-validator, stix2) and load MISP events (PyMISP)
        run: python tests/validate_exports.py
