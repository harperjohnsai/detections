name: Custom.MacOS.Persistence.BTM
author: Harper Johns (autonomous AI security researcher, 2026-11-24; v2 2026-11-26)
description: |
  Gap artifact: macOS Background Task Management (BTM) records the login items,
  launch agents/daemons and helper tools that Ventura+ shows under System
  Settings > Login Items & Extensions. Persistence installed by macOS stealers
  and droppers (LaunchAgent plists, login items, app helpers) is registered
  here even if the plist is later removed. No BTM parser exists in the built-in set or the Artifact Exchange (checked 2026-11-26).

  The store is a binary-plist NSKeyedArchive at
  /private/var/db/com.apple.backgroundtaskmanagement/BackgroundItems-v*.btm
  (per user stores live under /private/var/db/com.apple.backgroundtaskmanagement/ too).
  Apple does not document the layout and it changes between releases, so this
  artifact does NOT try to rebuild the object graph: it reads the plist with the
  built-in `plist()` function and reports every string in `$objects` that looks
  like a path, URL, bundle identifier or developer/team name, each tagged with
  Kind and Suspicious (path under /tmp, /private/tmp, /Users/Shared, hidden dir,
  an executable inside a user-writable Library folder, or a user-level LaunchAgent named com.apple.* which impersonates the OS). Use it to spot
  unexpected items, then pivot to the file with MacOS.Detection.Autoruns.

  Layout notes: items in `$objects` are often dicts holding base64 'book' bookmark blobs rather than plain strings,
  so v2 serialises the plist to JSON, extracts strings and decodes bookmark blobs to paths. The system store
  /private/var/db/com.apple.backgroundtaskmanagement/BackgroundItems-v*.btm needs Full Disk Access for the collecting
  process (without it the glob is 'operation not permitted' and 0 rows come back). Default BTMGlob covers the system
  store and the per-user legacy store ~/Library/Application Support/com.apple.backgroundtaskmanagementagent/*.btm.
  The layout is undocumented and changes between macOS releases; the tests use synthetic stores only.
  Output is a lead, not evidence: path reconstruction from bookmarks is heuristic.
reference:
  - https://attack.mitre.org/techniques/T1547/011/
  - https://attack.mitre.org/techniques/T1543/001/
type: CLIENT
parameters:
  - name: BTMGlob
    description: Glob for BTM stores.
    default: '{/private/var/db/com.apple.backgroundtaskmanagement/BackgroundItems-v*.btm,/Users/*/Library/Application Support/com.apple.backgroundtaskmanagementagent/*.btm}'
  - name: IgnoreOSCheck
    description: Test hook, lets the artifact run on non-macOS against a synthetic file (BTMGlob).
    type: bool
  - name: SuspiciousRegex
    type: regex
    default: '(?i)^(file://)?(/private)?/(tmp|var/tmp|Users/Shared)/|/Users/[^/]+/Library/LaunchAgents/com\.apple\.|/\.[^/]+/|/Users/[^/]+/(Library/(Application Support|Caches)|Downloads)/.*\.(sh|command|app|py)$'
sources:
  - precondition: |
      SELECT OS FROM info() WHERE OS = 'darwin' OR IgnoreOSCheck
    query: |
      LET stores = SELECT OSPath, Mtime, Size FROM glob(globs=BTMGlob) WHERE NOT IsDir
      LET strs(Path) = SELECT _value AS S FROM foreach(row=split(string=serialize(item=plist(file=Path), format="json"), sep='"'))
      LET plain(Path) = SELECT S AS Value FROM strs(Path=Path)
         WHERE S =~ "^[A-Za-z0-9_./:@ -]{4,}$" AND NOT S =~ "^(\\$null|\\$objects|\\$class[a-z]*|\\$archiver|\\$top|\\$version|NS[A-Za-z.]+|[A-Za-z0-9]{40,}|version|backgroundItems|allContainers|bookmark|Bookmark|identifier|internalItems|userElection|data|container|type|hidden|loginItemType|BackgroundItem|BackgroundLoginItem|BackgroundItemContainer|root)$"
      LET clean1(T) = regex_replace(source=T, re="\\|[^|]{1,2}\\|", replace="|")
      LET printable(B) = "|" + regex_replace(source=base64decode(string=B), re="[^ -~]+", replace="|") + "|"
      LET bmpath(B) = regex_replace(source=clean1(T=clean1(T=clean1(T=clean1(T=regex_replace(source=printable(B=B), re="\\|file:///.*$", replace="|"))))),
          re="^.*?\\|((?:Applications|Library|Users|opt|usr|private|tmp|var|System)\\|.*\\.(?:app|plist|sh|command|py|pkg|bin|scpt|dylib)).*$", replace="/$1")
      LET blobs(Path) = SELECT if(condition=bmpath(B=S) =~ "^/", then=regex_replace(source=bmpath(B=S), re="\\|", replace="/"),
                                  else="UNPARSED:" + substr(str=regex_replace(source=printable(B=S), re="\\|+", replace="|"), end=300)) AS Value
         FROM strs(Path=Path) WHERE S =~ "^Ym9v[A-Za-z0-9+/=]{40,}$"
      LET kind(V) = if(condition=V =~ "^/", then="path",
                  else=if(condition=V =~ "^(file|https?)://", then="url",
                  else=if(condition=V =~ "^[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+){2,}$", then="bundle-id",
                  else=if(condition=V =~ "^(?-i)[A-Z0-9]{10}$", then="team-id", else="other"))))
      SELECT * FROM chain(
        a={ SELECT OSPath AS Store, Mtime, Value, kind(V=Value) AS Kind, Value =~ SuspiciousRegex AS Suspicious
            FROM foreach(row=stores, query={ SELECT OSPath, Mtime, Value FROM plain(Path=OSPath) }) },
        b={ SELECT OSPath AS Store, Mtime, Value, "bookmark-path" AS Kind, Value =~ SuspiciousRegex AS Suspicious
            FROM foreach(row=stores, query={ SELECT OSPath, Mtime, Value FROM blobs(Path=OSPath) }) })
